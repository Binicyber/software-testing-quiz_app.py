<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Bini Automation Datacenter SDET Readiness Lab</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#edf6ff;font-family:Segoe UI,Arial,sans-serif}body{display:grid;place-items:center}.box{width:min(86vw,680px);padding:30px;border:1px solid #25435f;border-radius:18px;background:#0d1b2a;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}h2{font-size:clamp(28px,7vw,42px);line-height:1.2;margin:0 0 20px}.muted{color:#a9bdd0}.err{color:#ff9aaa;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box"><h2>Bini Automation Datacenter SDET Readiness Lab</h2><p id="s" class="muted">Loading training environment…</p></div>
<script>
(async()=>{
  const status=document.getElementById('s');
  try{
    const urls=[0,1,2,3,4].map(i=>`chunks/part${i}.txt?v=20260907b`);
    const parts=[];
    for(const url of urls){
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error(`Payload ${url} returned HTTP ${r.status}`);
      parts.push(await r.text());
    }
    const b64=parts.join('').replace(/\s+/g,'');
    if(!b64 || b64.length<30000) throw new Error(`Payload incomplete (${b64.length} characters)`);
    const binary=atob(b64);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    let html='';
    if('DecompressionStream' in window){
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      html=await new Response(stream).text();
    }else{
      await new Promise((resolve,reject)=>{
        const sc=document.createElement('script');
        sc.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        sc.onload=resolve;sc.onerror=()=>reject(new Error('Gzip fallback library could not load'));
        document.head.appendChild(sc);
      });
      html=new TextDecoder().decode(window.pako.ungzip(bytes));
    }
    if(!html.includes('Bini Automation Datacenter SDET Readiness Lab') || !html.includes('</html>')){
      throw new Error('Decoded training application failed integrity check');
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.className='err';
    status.textContent='Training app failed to load. Refresh once. If it persists, report this error:\n'+(err&&err.message?err.message:String(err));
  }
})();
</script>
</body>
</html>
