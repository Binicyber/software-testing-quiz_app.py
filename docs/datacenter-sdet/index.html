<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Bini Automation Datacenter SDET Readiness Lab</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#edf6ff;font-family:Segoe UI,Arial,sans-serif}body{display:grid;place-items:center}.box{width:min(86vw,680px);padding:30px;border:1px solid #25435f;border-radius:18px;background:#0d1b2a;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}h2{font-size:clamp(28px,7vw,42px);line-height:1.2;margin:0 0 20px}.muted{color:#a9bdd0}.err{color:#ff9aaa;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box"><h2>Bini Automation Datacenter SDET Readiness Lab</h2><p id="s" class="muted">Loading training environment…</p></div>
<script>
(async()=>{
  const status=document.getElementById('s');
  try{
    const urls=[0,1,2,3,4].map(i=>`chunks/part${i}.txt?v=20260907c`);
    const parts=[];
    for(const url of urls){
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error(`Payload ${url} returned HTTP ${r.status}`);
      parts.push(await r.text());
    }
    const b64=parts.join('').replace(/\s+/g,'');
    if(!b64 || b64.length<30000) throw new Error(`Payload incomplete (${b64.length} characters)`);
    const binary=atob(b64);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    let html='';
    if('DecompressionStream' in window){
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      html=await new Response(stream).text();
    }else{
      await new Promise((resolve,reject)=>{
        const sc=document.createElement('script');
        sc.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        sc.onload=resolve;sc.onerror=()=>reject(new Error('Gzip fallback library could not load'));
        document.head.appendChild(sc);
      });
      html=new TextDecoder().decode(window.pako.ungzip(bytes));
    }

    const oldPy=[
      'let pyodidePromise=null;',
      'async function getPy(){',
      '  if(!window.loadPyodide) throw new Error("Python engine could not load. Check internet access and reload.");',
      '  if(!pyodidePromise){',
      '    const s=document.createElement("script");',
      '    s.src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";',
      '    document.head.appendChild(s);',
      '    await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=()=>reject(new Error("Unable to load Python engine"));});',
      '    pyodidePromise=loadPyodide();',
      '  }',
      '  return pyodidePromise;',
      '}'
    ].join('\n');

    const newPy=[
      'let pyodidePromise=null;',
      'let pyodideScriptPromise=null;',
      'async function getPy(){',
      '  if(pyodidePromise) return pyodidePromise;',
      '  if(typeof window.loadPyodide!=="function"){',
      '    if(!pyodideScriptPromise){',
      '      pyodideScriptPromise=new Promise((resolve,reject)=>{',
      '        const existing=document.querySelector(\'script[data-bini-pyodide="1"]\');',
      '        if(existing){',
      '          if(typeof window.loadPyodide==="function"){resolve();return;}',
      '          existing.addEventListener("load",resolve,{once:true});',
      '          existing.addEventListener("error",()=>reject(new Error("Unable to load Python engine")), {once:true});',
      '          return;',
      '        }',
      '        const script=document.createElement("script");',
      '        script.dataset.biniPyodide="1";',
      '        script.src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";',
      '        script.async=true;',
      '        script.onload=resolve;',
      '        script.onerror=()=>reject(new Error("Unable to load Python engine. Check internet access and retry."));',
      '        document.head.appendChild(script);',
      '      });',
      '    }',
      '    await pyodideScriptPromise;',
      '  }',
      '  if(typeof window.loadPyodide!=="function") throw new Error("Python engine did not initialize. Reload the page and retry.");',
      '  pyodidePromise=window.loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.27.7/full/"});',
      '  return pyodidePromise;',
      '}'
    ].join('\n');

    if(html.includes(oldPy)) html=html.replace(oldPy,newPy);
    if(!html.includes('data-bini-pyodide="1"') && !html.includes("dataset.biniPyodide")) throw new Error('Python coding hotfix failed integrity check');

    const runCodeStart=html.indexOf("async function runCode(i,fromSubmit){");
    const answeredStart=html.indexOf("function answered(i){",runCodeStart);
    if(runCodeStart<0 || answeredStart<0) throw new Error("Coding runner hotfix target not found");
    html=html.slice(0,runCodeStart)+"async function runCode(i,fromSubmit){\n  const q=session[i], area=document.getElementById(\"code-\"+i);\n  const code=area?area.value:(answers[i]?.code||q.starter);\n  const state=document.getElementById(\"codeState-\"+i);\n  if(state){state.textContent=\"Loading Python / testing...\";state.className=\"small muted\";}\n\n  let py;\n  try{\n    py=await getPy();\n  }catch(err){\n    answers[i]={kind:\"code\",code,passed:false,tested:false,engineError:true,error:String(err)};\n    if(state){state.textContent=\"Python engine unavailable — tap Run hidden checks to retry\";state.className=\"small badText\";state.title=String(err);}\n    updateProgress();renderNav();\n    if(!fromSubmit) alert(\"The Python engine could not load. Check internet access, then tap Run hidden checks again.\");\n    return false;\n  }\n\n  try{\n    py.globals.set(\"__bini_user_code\",code);\n    py.globals.set(\"__bini_tests\",q.tests);\n    const runner=[\n      'ns = {\"__builtins__\": __builtins__}',\n      'exec(__bini_user_code, ns, ns)',\n      'exec(__bini_tests, ns, ns)',\n      '__bini_result__ = \"PASS\"'\n    ].join(\"\\n\");\n    await py.runPythonAsync(runner);\n    answers[i]={kind:\"code\",code,passed:true,tested:true};\n    if(state){state.textContent=\"All hidden checks passed\";state.className=\"small goodText\";state.title=\"\";}\n    updateProgress();renderNav();return true;\n  }catch(err){\n    answers[i]={kind:\"code\",code,passed:false,tested:true,error:String(err)};\n    if(state){state.textContent=\"Checks failed — review syntax and logic\";state.className=\"small badText\";state.title=String(err);}\n    updateProgress();renderNav();\n    if(!fromSubmit){\n      const detail=String(err||\"\").split(\"\\n\").filter(Boolean).slice(-1)[0]||\"Hidden check failed\";\n      alert(\"Your code did not pass all checks.\\n\\n\"+detail+\"\\n\\nYou can edit or paste code and run the checks again. You can still submit the assessment when ready.\");\n    }\n    return false;\n  }\n}"+"\n"+html.slice(answeredStart);

    const recoveryJs="(()=>{\n  const RECOVERY_KEY=\"bini_sdet_active_session_v2\";\n  const RECOVERY_VERSION=2;\n  let recoverySaveTimer=null;\n  function recoveryDescriptor(q){if(q.type===\"mc\"){const sourceIndex=MC.findIndex(x=>x.q===q.q&&x.d===q.d&&x.l===q.l);return {type:\"mc\",sourceIndex};}const sourceIndex=CODE.findIndex(x=>x.title===q.title&&x.d===q.d&&x.l===q.l);return {type:\"code\",sourceIndex};}\n  function cleanRecoveryAnswers(){const out={};Object.entries(answers||{}).forEach(([k,a])=>{if(!a)return;if(a.kind===\"mc\"&&a.value!==undefined)out[k]={kind:\"mc\",value:a.value};if(a.kind===\"code\"&&typeof a.code===\"string\")out[k]={kind:\"code\",code:a.code};});return out;}\n  function saveRecoveryNow(){try{if(!startedAt||finished||!session||!session.length)return;const descriptors=session.map(recoveryDescriptor);if(descriptors.some(x=>x.sourceIndex<0))return;const payload={version:RECOVERY_VERSION,mode:selectedMode,candidate,candidateEmail,started:startedAt.toISOString(),focusChanges:Number(focusChanges||0),session:descriptors,answers:cleanRecoveryAnswers(),scrollY:Math.max(0,Math.round(window.scrollY||0)),savedAt:new Date().toISOString()};localStorage.setItem(RECOVERY_KEY,JSON.stringify(payload));}catch(e){console.warn(\"Recovery save failed\",e);}}\n  function saveRecoverySoon(){clearTimeout(recoverySaveTimer);recoverySaveTimer=setTimeout(saveRecoveryNow,250);}\n  function getRecovery(){try{const r=JSON.parse(localStorage.getItem(RECOVERY_KEY)||\"null\");if(!r||r.version!==RECOVERY_VERSION||!MODE[r.mode]||!Array.isArray(r.session)||!r.session.length)return null;return r;}catch{return null;}}\n  function clearRecovery(){try{localStorage.removeItem(RECOVERY_KEY);}catch{}refreshRecoveryBanner();}\n  function recoveryRemaining(r){const started=Date.parse(r.started);if(!Number.isFinite(started))return 0;return Math.max(0,MODE[r.mode].minutes*60-Math.floor((Date.now()-started)/1000));}\n  function recoveryAnsweredCount(r){return Object.values(r.answers||{}).filter(a=>a&&((a.kind===\"mc\"&&a.value!==undefined)||(a.kind===\"code\"&&String(a.code||\"\").trim()))).length;}\n  function ensureRecoveryBanner(){let box=document.getElementById(\"recoveryBox\");if(box)return box;box=document.createElement(\"div\");box.id=\"recoveryBox\";box.className=\"certRequest hidden\";const home=document.getElementById(\"home\");const nameField=document.getElementById(\"candidateName\")?.closest(\"p\");if(home&&nameField)home.insertBefore(box,nameField);else if(home)home.appendChild(box);return box;}\n  function refreshRecoveryBanner(){const box=ensureRecoveryBanner();const r=getRecovery();if(!r){box.classList.add(\"hidden\");box.innerHTML=\"\";return;}const remain=recoveryRemaining(r);const answered=recoveryAnsweredCount(r);box.classList.remove(\"hidden\");box.innerHTML='<h3 style=\"margin-top:0\">Resume unfinished assessment</h3><p><strong>'+esc(r.candidate||\"Candidate\")+'</strong> · '+esc(MODE[r.mode].label)+' · '+answered+'/'+r.session.length+' answered</p><p class=\"'+(remain>0?\"goodText\":\"notice\")+'\">'+(remain>0?'Time remaining: '+fmt(remain):'Timer expired. Resume to finalize the saved attempt.')+'</p><div class=\"actionRow\"><button class=\"good\" onclick=\"resumeSavedAssessment()\">Resume saved attempt</button><button class=\"secondary\" onclick=\"discardSavedAssessment()\">Discard saved attempt</button></div><p class=\"small muted\">Recovery is stored only in this browser. The original start time is preserved, so reloading does not add extra time.</p>'; }\n  function restoreAnswerUI(){session.forEach((q,i)=>{const a=answers[i];if(!a)return;if(a.kind===\"mc\"&&a.value!==undefined){const input=document.querySelector('input[name=\"mc-'+i+'\"][value=\"'+a.value+'\"]');if(input)input.checked=true;document.querySelectorAll('label[id^=\"opt-'+i+'-\"]').forEach(x=>x.classList.remove(\"selected\"));const label=document.getElementById('opt-'+i+'-'+a.value);if(label)label.classList.add(\"selected\");if(selectedMode===\"foundation\"){const fb=document.getElementById(\"fb-\"+i);if(fb){const ok=a.value===q.a;fb.classList.remove(\"hidden\");fb.innerHTML='<strong class=\"'+(ok?\"goodText\":\"badText\")+'\">'+(ok?\"Correct\":\"Not quite\")+'</strong><br>'+esc(q.e);}}}else if(a.kind===\"code\"){const area=document.getElementById(\"code-\"+i);if(area)area.value=a.code||\"\";answers[i]={kind:\"code\",code:a.code||\"\",passed:false,tested:false};const state=document.getElementById(\"codeState-\"+i);if(state){state.textContent=\"Restored — run hidden checks\";state.className=\"small muted\";}}});updateProgress();renderNav();}\n  window.resumeSavedAssessment=function(){const r=getRecovery();if(!r)return;try{selectedMode=r.mode;selectMode(selectedMode);candidate=String(r.candidate||\"\");candidateEmail=String(r.candidateEmail||\"\");const cn=document.getElementById(\"candidateName\");if(cn)cn.value=candidate;const ce=document.getElementById(\"candidateEmail\");if(ce)ce.value=candidateEmail;const rc=document.getElementById(\"resultConsent\");if(rc)rc.checked=true;session=r.session.map(x=>{const src=x.type===\"mc\"?MC[x.sourceIndex]:CODE[x.sourceIndex];if(!src)throw new Error(\"Saved question bank entry is unavailable\");return {...src,type:x.type};});answers={};Object.entries(r.answers||{}).forEach(([k,a])=>{if(a.kind===\"mc\")answers[k]={kind:\"mc\",value:a.value};else if(a.kind===\"code\")answers[k]={kind:\"code\",code:String(a.code||\"\"),passed:false,tested:false};});startedAt=new Date(r.started);completedAt=null;focusChanges=Number(r.focusChanges||0);finished=false;secondsRemaining=recoveryRemaining(r);if(timerId){clearInterval(timerId);timerId=null;}document.getElementById(\"progress\").max=session.length;showOnly(\"examPanel\");renderExam();restoreAnswerUI();updateTimer();if(secondsRemaining>0){timerId=setInterval(()=>{secondsRemaining--;updateTimer();if(secondsRemaining<=0){clearInterval(timerId);timerId=null;submitAssessment(true);}},1000);}else{setTimeout(()=>submitAssessment(true),250);}setTimeout(()=>window.scrollTo({top:Number(r.scrollY||0),behavior:\"auto\"}),100);saveRecoveryNow();}catch(e){alert(\"Saved assessment could not be restored. The saved recovery record will be kept so it is not lost.\");console.error(e);}};\n  window.discardSavedAssessment=function(){if(confirm(\"Discard the saved unfinished assessment? This cannot be undone.\"))clearRecovery();};\n  const originalStartAssessment=startAssessment;startAssessment=function(){originalStartAssessment();if(startedAt&&!finished&&!document.getElementById(\"examPanel\").classList.contains(\"hidden\"))saveRecoveryNow();};\n  const originalChooseMC=chooseMC;chooseMC=function(i,j){originalChooseMC(i,j);saveRecoverySoon();};\n  const originalCodeChanged=codeChanged;codeChanged=function(i){originalCodeChanged(i);saveRecoverySoon();};\n  const originalRunCode=runCode;runCode=async function(i,fromSubmit){const result=await originalRunCode(i,fromSubmit);saveRecoverySoon();return result;};\n  const originalShowHome=showHome;showHome=function(){if(startedAt&&!finished)saveRecoveryNow();originalShowHome();refreshRecoveryBanner();};\n  const originalUpdateTimer=updateTimer;updateTimer=function(){if(startedAt&&!finished){const total=MODE[selectedMode].minutes*60;secondsRemaining=Math.max(0,total-Math.floor((Date.now()-startedAt.getTime())/1000));}originalUpdateTimer();};\n  const originalSubmitAssessment=submitAssessment;submitAssessment=async function(timeExpired){const beforeFinished=finished;const result=await originalSubmitAssessment(timeExpired);if(!beforeFinished&&finished)clearRecovery();return result;};\n  window.addEventListener(\"beforeunload\",saveRecoveryNow);document.addEventListener(\"visibilitychange\",()=>{if(document.hidden)saveRecoveryNow();});setInterval(()=>{if(startedAt&&!finished)saveRecoveryNow();},5000);refreshRecoveryBanner();\n})();\n";
    html=html.replace('</body>','<script>'+recoveryJs+'</scr'+'ipt></body>');

    if(!html.includes('Bini Automation Datacenter SDET Readiness Lab') || !html.includes('</html>')) throw new Error('Decoded training application failed integrity check');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.className='err';
    status.textContent='Training app failed to load. Refresh once. If it persists, report this error:\n'+(err&&err.message?err.message:String(err));
  }
})();
</script>
</body>
</html>
