<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bini Automation Networking Lab</title>
<style>
:root{--bg:#07111f;--p:#0e2238;--p2:#102a44;--line:#28506e;--t:#edf7ff;--m:#9fb8cc;--a:#20b8f5;--g:#35df91;--w:#f3c94f;--r:#ff627d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101c,#091a2b);color:var(--t);font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1000px;margin:auto;padding:18px}.hero,.card{background:rgba(14,34,56,.96);border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0}.hero{text-align:center}.brand{font-weight:900;letter-spacing:.16em;color:#7edcff}.hero h1{font-size:clamp(28px,6vw,50px);margin:10px}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{border:0;border-radius:13px;padding:14px 18px;background:#1c4668;color:white;font-weight:800;font-size:16px;cursor:pointer}.btn.primary{background:#087bb2}.btn.good{background:#147d55}.btn.warn{background:#7c5e10}.btn.danger{background:#8d2940}.btn:disabled{opacity:.5}.pill{display:inline-block;border:1px solid #47718f;border-radius:99px;padding:5px 10px;margin:3px;color:#c8e9ff}.lesson h3,.q h3{color:#83dcff}.lesson{border-left:4px solid var(--a)}.q{background:#0b1c2d;border:1px solid #244b68;border-radius:17px;padding:18px;margin:14px 0}.opt{display:block;padding:12px;border:1px solid #315773;border-radius:12px;margin:9px 0}.opt:hover{background:#15334d}.correct{border-color:var(--g)!important}.wrong{border-color:var(--r)!important}.explain{padding:12px;border-radius:12px;background:#071827;margin-top:10px}.goodtxt{color:var(--g)}.badtxt{color:var(--r)}.top{position:sticky;top:0;z-index:5;background:#07111fee;border-bottom:1px solid #23435b;padding:10px;backdrop-filter:blur(8px)}.bar{height:10px;background:#152b3d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#22aee8}.timer{font-size:22px;font-weight:900;color:var(--w)}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #345a74;background:#071827;color:white;margin:6px 0}code{color:#a7e7ff}.hidden{display:none!important}.scenario{border:1px dashed #4e7895;padding:14px;border-radius:14px}.footer{text-align:center;color:#7e9bb1;padding:30px 8px}.resume{border-color:#d5a72b}.score{font-size:40px;font-weight:900}
</style></head><body><div id="app"></div>
<script>
const lessons=[
["1. Network Foundations","A network connects devices so they can communicate and share data, services and resources. PAN covers a person, LAN a local site, MAN a metro area, and WAN spans large geographic areas. Common topologies include bus, star, ring, mesh and tree."],
["2. Devices","A switch forwards Ethernet frames inside a LAN using MAC addresses. A router connects IP networks. An access point bridges wireless clients into a network. A NIC gives a host network connectivity. Firewalls enforce traffic policy."],
["3. Media & Connectors","Twisted-pair copper is common for Ethernet and commonly uses RJ45. Coaxial has a center conductor and shielding. Fiber carries light, supports long distances/high bandwidth and resists electromagnetic interference. SC is one fiber connector type."],
["4. MAC, IP & ARP","A MAC address identifies a network interface at Layer 2. An IP address is a logical Layer 3 address. ARP resolves an IPv4 address to a local MAC address. A default gateway is the router used for destinations outside the local subnet."],
["5. OSI Model","7 Application, 6 Presentation, 5 Session, 4 Transport, 3 Network, 2 Data Link, 1 Physical. TCP/UDP are Transport concepts, IP/routing are Layer 3, Ethernet/MAC are Layer 2, and bits/signals/media are Layer 1."],
["6. TCP/IP & Ports","TCP is connection-oriented and reliable. UDP is connectionless and lightweight. Common ports: HTTP 80, HTTPS 443, SSH 22, DNS 53, DHCP 67/68, SMTP 25, POP3 110, IMAP 143, RDP 3389, SNMP 161/162."],
["7. Ethernet & Switching","A switch learns the source MAC address of incoming frames. Known destination MACs are forwarded to the associated port. Unknown unicasts are flooded within the VLAN except the incoming port. Broadcast MAC is FF:FF:FF:FF:FF:FF."],
["8. Routing","Routers inspect the destination IP and select the most specific matching route using longest-prefix match. Connected routes come from active interfaces, static routes are configured, dynamic routes are learned. 0.0.0.0/0 is the IPv4 default route."],
["9. Services & Troubleshooting","DNS resolves names. DHCP uses DORA: Discover, Offer, Request, Acknowledge. NAT translates addresses. Start troubleshooting with physical connectivity, then IP configuration, reachability, path, DNS, logs and policy."],
["10. Security","The CIA triad is Confidentiality, Integrity and Availability. VPNs protect traffic through encrypted tunnels. ACLs permit or deny traffic by criteria. Stateful firewalls track connection state. Switch port security can limit learned MAC addresses."]
];
const bank=[
["Foundations","A LAN normally describes which scope?",["A local site such as an office","An entire continent","Only Bluetooth devices","Only the Internet"],0,"LAN means Local Area Network."],
["Foundations","Which topology connects endpoints to a central device?",["Ring","Star","Bus","Point-to-point WAN"],1,"A star topology uses a central connecting device."],
["Devices","Which device primarily forwards frames using MAC addresses?",["Router","Switch","DNS server","Modem"],1,"Ethernet switches make Layer 2 forwarding decisions using MAC addresses."],
["Devices","Which device connects different IP networks?",["Router","Repeater","Patch panel","NIC"],0,"Routers forward packets between IP networks."],
["Media","Which medium is least affected by electromagnetic interference?",["UTP copper","Coaxial","Fiber optic","Telephone wire"],2,"Fiber carries light rather than electrical signals."],
["Media","Which connector is commonly used with twisted-pair Ethernet?",["RJ45","RJ11","SC","F connector"],0,"RJ45-style modular connectors are common for twisted-pair Ethernet."],
["Addressing","ARP is primarily used to map:",["MAC to DNS","IPv4 to MAC on a local network","Port to process","IPv6 to URL"],1,"ARP resolves local IPv4 addresses to MAC addresses."],
["Addressing","A default gateway is used when:",["The destination is outside the local subnet","DNS is disabled","The MAC is broadcast","The switch table is full"],0,"Off-subnet traffic is normally sent to a router/default gateway."],
["OSI","Which OSI layer handles logical addressing and routing?",["Physical","Data Link","Network","Application"],2,"Layer 3 is the Network layer."],
["OSI","Which OSI layer handles MAC addressing?",["Transport","Data Link","Session","Presentation"],1,"MAC addressing belongs to Layer 2."],
["OSI","Which layer provides end-to-end transport using TCP or UDP?",["Transport","Network","Physical","Presentation"],0,"TCP and UDP operate at the Transport layer."],
["Protocols","Which protocol is connection-oriented and reliable?",["UDP","ARP","TCP","ICMP"],2,"TCP provides connection-oriented reliable transport."],
["Protocols","HTTPS normally uses which TCP port?",["22","53","80","443"],3,"HTTPS commonly uses TCP 443."],
["Protocols","DNS commonly uses port:",["25","53","110","3389"],1,"DNS commonly uses port 53."],
["Protocols","SSH normally uses:",["TCP 22","UDP 22","TCP 443","UDP 161"],0,"SSH normally listens on TCP port 22."],
["Switching","A switch learns a MAC address from which field of an incoming frame?",["Destination MAC","Source MAC","FCS","EtherType only"],1,"Switches learn source MAC-to-port mappings."],
["Switching","What happens to an unknown unicast in a VLAN?",["Always dropped","Sent only to router","Flooded except incoming port","Converted to broadcast IP"],2,"Unknown unicast traffic is flooded within the VLAN except the ingress port."],
["Switching","Ethernet broadcast MAC address is:",["00:00:00:00:00:00","FF:FF:FF:FF:FF:FF","127.0.0.1","255.255.255.0"],1,"All Fs is the Ethernet broadcast destination MAC."],
["Routing","When several routes match, a router normally chooses:",["The oldest route","The longest-prefix/most specific match","The route with shortest IP text","The default route first"],1,"Longest-prefix match selects the most specific destination prefix."],
["Routing","What does 0.0.0.0/0 represent in IPv4 routing?",["Loopback","Broadcast","Default route","Host route"],2,"0.0.0.0/0 matches any IPv4 destination when no more-specific route wins."],
["Routing","A route manually entered by an administrator is:",["Connected","Static","ARP","Broadcast"],1,"Static routes are manually configured."],
["Services","Correct DHCP DORA order:",["Discover, Offer, Request, Acknowledge","Discover, Request, Offer, Acknowledge","Offer, Discover, Acknowledge, Request","Request, Offer, Discover, Acknowledge"],0,"DHCP commonly follows Discover → Offer → Request → Acknowledge."],
["Services","DNS primarily converts:",["MAC to switch ports","Names to IP addresses","Ports to VLANs","Frames to packets"],1,"DNS resolves names to IP addresses."],
["Services","NAT commonly translates:",["Private and public addresses","MAC to hostname","TCP to UDP","Fiber to copper"],0,"NAT changes network-layer address information, commonly private-to-public."],
["Troubleshooting","Which command is commonly used first to test IP reachability?",["ping","mkdir","chmod","tar"],0,"ping sends ICMP echo requests to test reachability."],
["Troubleshooting","Which tool shows the hop-by-hop path toward a destination?",["nslookup","traceroute/tracert","cat","grep"],1,"traceroute (tracert on Windows) reveals path hops."],
["Troubleshooting","A host can ping 8.8.8.8 but cannot reach example.com by name. First suspect:",["DNS resolution","Bad Ethernet FCS everywhere","No IP connectivity","CPU fan"],0,"Working IP reachability with failed names strongly points to DNS."],
["Security","CIA stands for:",["Control, Internet, Access","Confidentiality, Integrity, Availability","Cipher, Identity, Authentication","Connection, Inspection, Authorization"],1,"The CIA triad is Confidentiality, Integrity and Availability."],
["Security","Which firewall type tracks active connection state?",["Stateless only","Stateful","Patch panel","Hub"],1,"A stateful firewall tracks sessions/connections."],
["Security","An ACL is used to:",["Permit or deny traffic using rules","Assign MAC addresses","Resolve DNS","Generate fiber light"],0,"Access Control Lists filter traffic according to configured criteria."],
["Security","A VPN typically provides:",["An encrypted tunnel across an untrusted network","A new MAC burned into the NIC","A DNS root zone","A physical fiber path"],0,"VPNs can create encrypted tunnels over public networks."],
["Security","Switch port security can help limit:",["MAC addresses learned on a port","DNS TTL only","Router CPU clock","Fiber wavelength"],0,"Port security can restrict the MAC addresses allowed/learned on a switch port."],
["Scenario","PC 192.168.1.10/24 needs 10.0.0.10. What should it use first?",["Its default gateway","ARP directly for the remote PC across routers","DNS root server","Broadcast MAC as next-hop IP"],0,"Because 10.0.0.10 is off-subnet, the PC sends the frame toward its default gateway."],
["Scenario","Routes are 192.168.0.0/16 and 192.168.1.0/24. Destination is 192.168.1.50. Which wins?",["/16","/24","Both are discarded","0.0.0.0/0"],1,"/24 is the longer and more specific matching prefix."],
["Scenario","Link light is off after moving a workstation. Best first check?",["Physical cable/port","Reinstall DNS","Change default route","Clear browser cache"],0,"Troubleshooting should begin with the physical layer when link is absent."],
["Scenario","A switch receives a frame for an unknown destination MAC. What is expected?",["Flood within VLAN except ingress","Send to DNS","Drop every time","Route it at Layer 3"],0,"Normal unknown-unicast behavior is flooding within that broadcast domain."],
["Scenario","Client has 169.254.x.x instead of expected corporate IPv4 address. Likely area to investigate?",["DHCP availability/path","HTTPS certificate","CAM aging only","NTP timezone"],0,"An APIPA-style address often indicates the client did not obtain a DHCP lease."],
["Scenario","Users reach sites by IP but not hostname. Which service should you test?",["DNS","DHCP only","ARP only","STP only"],0,"Name-resolution failure points to DNS."],
["Scenario","An ACL says 'permit tcp 192.168.1.0/24 any eq 80' then deny all. What is allowed?",["HTTP/TCP 80 from that subnet","All traffic","Only DNS","Only SSH"],0,"The rule permits TCP destination port 80 from the specified source subnet."],
["Scenario","Which control best reduces unauthorized devices appearing on a switch access port?",["Port security","DNS recursion","NAT overload","Traceroute"],0,"Port security is designed to constrain endpoint MAC use on switch ports."]
];
const KEY="bini_network_lab_recovery_v1"; let state=null,tick=null;
function el(){return document.getElementById("app")} function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function save(){if(!state||state.done)return;localStorage.setItem(KEY,JSON.stringify(state))}
function home(){clearInterval(tick);const r=localStorage.getItem(KEY);el().innerHTML=`<main><section class="hero"><div class="brand">BINI AUTOMATION</div><h1>Networking Engineering Readiness Lab</h1><p class="muted">Foundations → Switching → Routing → Services → Security → Troubleshooting</p><span class="pill">Mobile First</span><span class="pill">Autosave + Resume</span><span class="pill">Scenario Labs</span></section>${r?'<section class="card resume"><h2>Saved attempt found</h2><p>Your unfinished session can be restored with its original timer.</p><button class="btn good" onclick="resume()">Resume unfinished assessment</button></section>':''}<section class="grid"><div class="card"><h2>Learn</h2><p>10 focused lessons built from your networking notes.</p><button class="btn primary" onclick="learn()">Open learning center</button></div><div class="card"><h2>Practice</h2><p>40 questions. Immediate feedback and explanations.</p><button class="btn good" onclick="start('practice')">Start practice</button></div><div class="card"><h2>Advanced</h2><p>30 randomized questions emphasizing packet flow and troubleshooting.</p><button class="btn warn" onclick="start('advanced')">Start advanced</button></div><div class="card"><h2>Timed Exam</h2><p>40 questions • 60 minutes • feedback after submission.</p><button class="btn danger" onclick="start('exam')">Start exam</button></div></section><section class="card"><h2>Skills covered</h2><p>LAN/WAN • topologies • devices • cabling • MAC/IP/ARP • OSI • TCP/UDP • ports • Ethernet/CAM • routing • DNS/DHCP/NAT • Linux/Windows troubleshooting • VPN • ACL • firewalls • CIA triad.</p></section><div class="footer">Independent Bini Automation training content.</div></main>`}
function learn(){el().innerHTML='<main><button class="btn" onclick="home()">← Home</button><section class="hero"><div class="brand">LEARNING CENTER</div><h1>Networking Core</h1></section>'+lessons.map(x=>`<section class="card lesson"><h3>${x[0]}</h3><p>${x[1]}</p></section>`).join('')+'<section class="card scenario"><h2>Troubleshooting workflow</h2><p><b>1.</b> Physical link → <b>2.</b> IP/mask/gateway → <b>3.</b> local gateway → <b>4.</b> remote IP → <b>5.</b> DNS → <b>6.</b> route/firewall/ACL → <b>7.</b> logs and packet evidence.</p></section></main>'}
function start(mode){let qs=mode==='advanced'?shuffle(bank.filter(q=>['Scenario','Routing','Switching','Security','Troubleshooting'].includes(q[0]))).slice(0,30):mode==='exam'?shuffle(bank).slice(0,40):bank.map((q,i)=>q);state={mode,order:qs.map(q=>bank.indexOf(q)),ans:{},started:Date.now(),duration:mode==='exam'?3600:7200,done:false};save();render()}
function resume(){try{state=JSON.parse(localStorage.getItem(KEY));render()}catch(e){localStorage.removeItem(KEY);home()}}
function render(){clearInterval(tick);let qs=state.order.map(i=>bank[i]);el().innerHTML=`<div class="top"><main style="padding:0"><div style="display:flex;justify-content:space-between"><b>${state.mode.toUpperCase()}</b><span id="tm" class="timer"></span></div><div class="bar"><i id="prog"></i></div><span id="count"></span></main></div><main><section class="hero"><div class="brand">BINI AUTOMATION</div><h1>Networking Readiness Lab</h1><p class="muted">${state.mode==='practice'?'Immediate teaching feedback enabled.':'Answer every scenario, then submit.'}</p></section><div id="questions">${qs.map((q,i)=>question(q,i)).join('')}</div><section class="card"><button class="btn danger" onclick="submitExam()">Submit assessment</button> <button class="btn" onclick="home()">Exit training</button></section></main>`;update();tick=setInterval(update,1000);window.addEventListener('beforeunload',save,{once:true})}
function question(q,i){let picked=state.ans[i];return `<section class="q" id="q${i}"><span class="pill">${q[0]}</span><h3>${i+1}. ${q[1]}</h3>${q[2].map((o,j)=>`<label class="opt ${state.mode==='practice'&&picked!=null?(j===q[3]?'correct':picked===j?'wrong':''):''}"><input type="radio" name="q${i}" ${picked===j?'checked':''} onchange="answer(${i},${j})"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div id="e${i}">${state.mode==='practice'&&picked!=null?explain(q,picked):''}</div></section>`}
function explain(q,p){return `<div class="explain"><b class="${p===q[3]?'goodtxt':'badtxt'}">${p===q[3]?'Correct':'Review this'}</b><br>${q[4]}</div>`}
function answer(i,j){state.ans[i]=j;save();if(state.mode==='practice'){let q=bank[state.order[i]];document.getElementById('e'+i).innerHTML=explain(q,j);document.querySelectorAll('#q'+i+' .opt').forEach((x,k)=>{x.classList.remove('correct','wrong');if(k===q[3])x.classList.add('correct');else if(k===j)x.classList.add('wrong')})}update()}
function update(){if(!state)return;let n=state.order.length,a=Object.keys(state.ans).length;let c=document.getElementById('count'),p=document.getElementById('prog');if(c)c.textContent=a+'/'+n+' answered';if(p)p.style.width=(100*a/n)+'%';let left=Math.max(0,state.duration-Math.floor((Date.now()-state.started)/1000));let t=document.getElementById('tm');if(t)t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0&&!state.done)submitExam(true)}
function submitExam(timeout=false){if(!state)return;let n=state.order.length,answered=Object.keys(state.ans).length;if(!timeout&&answered<n&&!confirm('You have '+(n-answered)+' unanswered question(s). Submit anyway?'))return;let correct=0,by={};state.order.forEach((bi,i)=>{let q=bank[bi],ok=state.ans[i]===q[3];if(ok)correct++;by[q[0]]??=[0,0];by[q[0]][1]++;if(ok)by[q[0]][0]++});state.done=true;localStorage.removeItem(KEY);clearInterval(tick);let pct=Math.round(correct/n*100);el().innerHTML=`<main><section class="hero"><div class="brand">ASSESSMENT COMPLETE</div><div class="score">${pct}%</div><h2>${correct} / ${n} correct</h2><p>${timeout?'Time expired and the assessment was submitted.':'Submission complete.'}</p></section><section class="card"><h2>Section breakdown</h2>${Object.entries(by).map(([k,v])=>`<p><b>${k}</b>: ${v[0]}/${v[1]}</p>`).join('')}</section><section class="card"><button class="btn primary" onclick="home()">Return home</button> <button class="btn good" onclick="start('practice')">Practice again</button></section></main>`}
}
home();
</script></body></html>
