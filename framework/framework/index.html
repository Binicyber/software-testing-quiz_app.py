<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GB300 L10 / L11 Diagnostic Framework</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#eef1f6;
  --panel:#f8fafc;
  --ink:#0f172a;
  --muted:#64748b;
  --line:#dbe1ea;
  --brand:#1e40af;
  --shadow:0 8px 24px rgba(0,0,0,.08);
}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

.container{max-width:1200px;margin:auto;padding:16px;}

h1{margin:0;color:var(--brand)}
.sub{color:var(--muted);font-size:13px}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin-top:12px;
  box-shadow:var(--shadow);
}

.btn{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
  cursor:pointer;
  font-weight:700;
}
.btn.primary{background:#1e40af;color:#fff}

.grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:12px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}

input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
  font-weight:600;
}

#viz{height:650px;border:1px solid var(--line);border-radius:12px}

/* ===== TV PANEL ===== */
.tvFooter{
  position:sticky;
  bottom:10px;
  margin-top:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  box-shadow:var(--shadow);
}
.tvTop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tvControls{display:flex;gap:10px}
.tvMarquee{height:52px;overflow:hidden;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.tvTrack{
  display:flex;
  gap:48px;
  white-space:nowrap;
  animation:scroll 30s linear infinite;
}
.tvText{font-size:18px;font-weight:900;transform:translateZ(30px) rotateY(-10deg)}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>

<body>
<div class="container">

<h1>GB300 Diagnostic Framework</h1>
<div class="sub">L10 / L11 — Step Driven Diagnostics</div>

<div class="panel">
  <button class="btn primary" onclick="loadDept('L10')">L10</button>
  <button class="btn primary" onclick="loadDept('L11')">L11</button>
</div>

<div class="grid">

  <div class="panel">
    <svg id="viz"></svg>
  </div>

  <div class="panel" id="details">
    <b>Select a failure</b>
  </div>

  <div class="panel">
    <b>Logs</b><br><br>
    Rack Location
    <input id="rack"><br><br>
    Server SN
    <input id="server"><br><br>
    Result
    <select id="result">
      <option>PASS</option>
      <option>FAIL</option>
      <option>FIXED</option>
      <option>ESCALATE</option>
    </select><br><br>
    <button class="btn primary" onclick="saveLog()">Add Log</button>
    <button class="btn" onclick="exportExcel()">Export Excel</button>
  </div>

</div>

<!-- TV -->
<div class="tvFooter">
  <div class="tvTop">
    <div>
      <b>Daily Mood TV</b>
      <div class="sub">Operations ticker</div>
    </div>
    <div class="tvControls">
      <input id="tvText" placeholder="Type message">
      <button class="btn primary" onclick="setTV()">Continue</button>
    </div>
  </div>
  <div class="tvMarquee">
    <div class="tvTrack" id="tvTrack">
      <span class="tvText" id="tvA">System Ready</span>
      <span class="tvText" id="tvB">System Ready</span>
    </div>
  </div>
</div>

</div>

<script>
let data = {
  L10:{
    name:"L10",
    items:[
      {id:"L10-01",name:"Host Boot Fail",steps:[
        "Check cables and LEDs",
        "Reseat BMC sideband",
        "Reseat BMC",
        "Replace cable",
        "Replace BMC",
        "Escalate to EE"
      ]}
    ]
  },
  L11:{
    name:"L11",
    items:[
      {id:"L11-01",name:"NVLink Failure",steps:[
        "Check NVSwitch power",
        "Verify fiber links",
        "Reseat NVSwitch",
        "Retest rack",
        "Escalate"
      ]}
    ]
  }
};

let current="L10";

function loadDept(d){
  current=d;
  draw();
}

function draw(){
  const svg=d3.select("#viz");
  svg.selectAll("*").remove();
  let g=svg.append("g").attr("transform","translate(50,50)");

  data[current].items.forEach((i,idx)=>{
    let y=idx*80;
    g.append("circle").attr("cx",50).attr("cy",y).attr("r",12)
      .attr("fill","#1e40af")
      .on("click",()=>show(i));
    g.append("text").attr("x",80).attr("y",y+5).text(i.name);
  });
}

function show(item){
  let d=document.getElementById("details");
  d.innerHTML="<b>"+item.name+"</b><br><br>";
  item.steps.forEach((s,i)=>{
    d.innerHTML+=`<div>Step ${i+1}: ${s}</div>`;
  });
}

function saveLog(){
  alert("Log saved (local)");
}

function exportExcel(){
  alert("Excel exported");
}

function setTV(){
  let t=document.getElementById("tvText").value||"System Active";
  document.getElementById("tvA").textContent=t;
  document.getElementById("tvB").textContent=t;
}

draw();
</script>
</body>
</html>
