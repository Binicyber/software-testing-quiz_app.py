<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GB300 TSG Tunnel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #eaeaea;
}
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}
h1 {
  text-align: center;
  color: #4cc3ff;
}
.sub {
  font-size: 14px;
  opacity: .8;
}
input, button {
  padding: 10px;
  border-radius: 6px;
  border: none;
  font-size: 15px;
}
input {
  width: 100%;
}
button {
  cursor: pointer;
  background: #1e88e5;
  color: white;
}
button:hover { background: #1565c0; }

.section {
  background: #111a2b;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.pill {
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid #555;
}

#scanModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:9999;
}
#scanModal > div {
  background:#0b1220;
  margin:40px auto;
  max-width:900px;
  padding:20px;
  border-radius:12px;
}
</style>
</head>

<body>
<div class="container">

<h1>GB300 TSG Tunnel</h1>
<p class="sub" style="text-align:center;">L10 / L11 Diagnostic Framework</p>

<!-- USER -->
<div class="section">
  <b>User Info</b><br><br>
  <input id="userName" placeholder="Your Name"><br><br>
  <input id="emailGoogle" placeholder="Google / Open-Test Email"><br><br>
  <input id="emailMS" placeholder="MS Work Email">
</div>

<!-- SERVER -->
<div class="section">
  <b>Server</b><br><br>

  <div style="display:flex;gap:10px;">
    <input id="logServer" placeholder="Server Serial Number">
    <button id="scanSNBtn">Scan SN</button>
  </div>

  <br>
  <input id="logRack" placeholder="Rack Location">
</div>

<!-- HEARTBEAT -->
<div class="section">
  <b>Open-Test Heartbeat</b><br><br>

  <span id="hbPill" class="pill">OFF</span>
  <label style="margin-left:10px;">
    <input type="checkbox" id="hbEnable"> Enable
  </label>
  <button id="hbNowBtn">Refresh</button>

  <div id="hbInfo" class="sub" style="margin-top:10px;">No data yet</div>
</div>

<!-- ACTION -->
<div class="section">
  <b>Actions</b><br><br>
  <button onclick="alert('L10 flow coming next')">Start L10</button>
</div>

</div>

<!-- SCAN MODAL -->
<div id="scanModal">
  <div>
    <div style="display:flex;justify-content:space-between;">
      <b>Scan Serial Number</b>
      <button onclick="closeScan()">Close</button>
    </div>
    <p class="sub">Use camera or barcode label</p>
    <video id="scanVideo" style="width:100%;border-radius:10px;"></video>
    <div id="scanStatus" class="sub">Starting camera...</div>
  </div>
</div>

<script>
// ========================
// HEARTBEAT
// ========================
const OPENTEST = "http://127.0.0.1:8787";
let hbTimer = null;

async function heartbeat(){
  const sn = document.getElementById("logServer").value.trim();
  if(!sn){
    document.getElementById("hbPill").textContent = "SN required";
    return;
  }
  try{
    const r = await fetch(`${OPENTEST}/status?sn=${sn}`);
    const j = await r.json();
    document.getElementById("hbPill").textContent = "CONNECTED";
    document.getElementById("hbPill").style.color = "#3cff9d";
    document.getElementById("hbInfo").innerText =
      `Status: ${j.record.status} | Phase: ${j.record.phase}`;
  }catch{
    document.getElementById("hbPill").textContent = "OFFLINE";
    document.getElementById("hbInfo").innerText = "Agent not reachable";
  }
}

document.getElementById("hbEnable").addEventListener("change", e=>{
  if(e.target.checked){
    heartbeat();
    hbTimer = setInterval(heartbeat, 15000);
  } else {
    clearInterval(hbTimer);
  }
});

document.getElementById("hbNowBtn").onclick = heartbeat;

// ========================
// SCANNER
// ========================
let scanStream = null;
let scanLoop = null;

document.getElementById("scanSNBtn").onclick = () => {
  document.getElementById("scanModal").style.display = "block";
  startScan();
};

function closeScan(){
  document.getElementById("scanModal").style.display = "none";
  if(scanStream){
    scanStream.getTracks().forEach(t=>t.stop());
  }
}

async function startScan(){
  if(!("BarcodeDetector" in window)){
    document.getElementById("scanStatus").innerText =
      "Scanner not supported. Type SN manually.";
    return;
  }

  const detector = new BarcodeDetector({
    formats: ["qr_code","code_128","code_39"]
  });

  scanStream = await navigator.mediaDevices.getUserMedia({ video:true });
  scanVideo.srcObject = scanStream;
  await scanVideo.play();

  scanLoop = setInterval(async ()=>{
    const codes = await detector.detect(scanVideo);
    if(codes.length){
      document.getElementById("logServer").value = codes[0].rawValue;
      closeScan();
    }
  }, 300);
}

// Scanner keyboard support
document.getElementById("logServer").addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    heartbeat();
  }
});
</script>

</body>
</html>
